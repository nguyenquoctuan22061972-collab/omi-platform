name: Deploy (manual)

# Deploy thủ công để tránh auto-deploy ngoài ý muốn (PRD-005 §4).
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag để deploy (vd: v1.2.3 hoặc git sha)"
        required: true
        default: "latest"

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production   # yêu cầu approval + secrets ở GitHub Environment
    steps:
      - uses: actions/checkout@v4

      - name: Guard — cần secrets deploy
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
        run: |
          if [ -z "$SSH_HOST" ]; then
            echo "::error::Chưa cấu hình secrets deploy (DEPLOY_SSH_HOST...). Đặt trong Environment 'production'."
            exit 1
          fi

      - name: Deploy qua SSH (compose pull + up)
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          echo "Placeholder deploy: dùng $IMAGE_TAG"
          # mkdir -p ~/.ssh && echo "$SSH_KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          # ssh -i ~/.ssh/id "$SSH_USER@$SSH_HOST" \
          #   "cd /srv/omi-platform && IMAGE_TAG=$IMAGE_TAG docker compose -f deploy/docker-compose.prod.yml pull && \
          #    docker compose -f deploy/docker-compose.prod.yml up -d && deploy/scripts/healthcheck.sh"

      - name: Rollback hint
        if: failure()
        run: echo "Deploy fail → chạy lại workflow với image_tag phiên bản trước (xem runbook)."
