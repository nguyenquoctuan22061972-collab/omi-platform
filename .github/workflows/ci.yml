name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (auth-rbac)
        run: pip install -r apps/auth-rbac/requirements.txt

      - name: Test — CRM Core (PRD-001 + CR-001)
        working-directory: apps/crm-core
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Test — Auth & RBAC (PRD-002)
        working-directory: apps/auth-rbac
        env:
          AUTH_SECRET: ci-secret
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Test — Workflows validator (PRD-003)
        working-directory: workflows
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Test — Frontend Dashboard (PRD-004)
        working-directory: apps/dashboard
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Test — Deploy config (PRD-005)
        working-directory: deploy
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Test — Integration adapters (PRD-006 D)
        working-directory: libs/integrations
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Test — Runtime Health (PRD-008 A)
        working-directory: apps/runtime-health
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Test — libs/logging (PRD-008 B)
        working-directory: libs/logging
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Test — libs/audit (PRD-008 C)
        working-directory: libs/audit
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Test — libs/metrics (PRD-008 D)
        working-directory: libs/metrics
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Test — AI Job Queue (PRD-009 A)
        working-directory: apps/content-factory/queue
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Test — Content Pipeline (PRD-009 E)
        working-directory: apps/content-factory/pipeline
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Test — Prompt Registry (PRD-009 B)
        working-directory: libs/prompts
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Test — AI Router (PRD-009 C)
        working-directory: libs/ai_router
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Test — Publish Connectors (PRD-009 G)
        working-directory: libs/publish
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Test — CEO Autopilot (PRD-009 F + PRD-010 F)
        working-directory: apps/ceo-autopilot
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Test — Revenue Engine (PRD-010 A)
        working-directory: apps/revenue-engine
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Test — Affiliate Registry (PRD-010 B)
        working-directory: libs/affiliate
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Test — Lead Engine (PRD-010 C)
        working-directory: libs/lead
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Test — YouTube Runtime (PRD-010 D)
        working-directory: libs/youtube
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Test — Content Calendar (PRD-010 E)
        working-directory: apps/content-factory/calendar
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Test — Analytics Layer (PRD-010 G)
        working-directory: libs/analytics
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Test — Runtime env loader (PRD-011 A)
        working-directory: libs/runtime
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  build-images:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build service images (no push)
        run: |
          docker build -f deploy/Dockerfile.crm-core -t omi/crm-core:ci .
          docker build -f deploy/Dockerfile.auth-rbac -t omi/auth-rbac:ci .
