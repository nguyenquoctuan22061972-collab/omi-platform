name: Gemini connectivity

# Kiểm tra an toàn, không tốn phí: secret GEMINI_API_KEY có tồn tại không và
# Gemini API có trả lời không. Chỉ gọi models.list (không sinh nội dung).
# Khóa gửi qua header, không nằm trong URL; log chỉ in mã HTTP và tên model.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/gemini-connectivity.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Secret GEMINI_API_KEY có được thiết lập
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::FAIL — secret GEMINI_API_KEY chưa được thiết lập (hoặc rỗng)"
            exit 1
          fi
          echo "PASS — secret GEMINI_API_KEY tồn tại (độ dài ${#GEMINI_API_KEY} ký tự)"

      - name: Gọi Gemini API models.list (miễn phí)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          code=$(curl -sS -o models.json -w '%{http_code}' \
            -H "x-goog-api-key: ${GEMINI_API_KEY}" \
            "https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000")
          echo "HTTP ${code}"
          if [ "$code" != "200" ]; then
            python3 -c "import json;d=json.load(open('models.json'));e=d.get('error',{});print('API error:',e.get('code'),e.get('status'),e.get('message','')[:200])" || true
            echo "::error::FAIL — Gemini API trả HTTP ${code}"
            exit 1
          fi
          python3 - <<'EOF'
          import json
          names = [m["name"].split("/", 1)[1] for m in json.load(open("models.json")).get("models", [])]
          print(f"PASS — Gemini API trả lời, {len(names)} model khả dụng với khóa này")
          for kw in ("tts", "image", "flash", "pro"):
              hits = sorted(n for n in names if kw in n)
              print(f"  [{kw}] {len(hits)}: {', '.join(hits[:12])}")
          EOF
          rm -f models.json
