<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f1220" />
<link rel="manifest" href="manifest.webmanifest" />
<title>OMI CEO Console</title>
<style>
  :root { --bg:#0f1220; --card:#1a1f35; --ink:#e8eaf6; --mut:#98a0c0; --ok:#3ddc84; --warn:#ffcf5c; --bad:#ff6b6b; --acc:#6ea8fe; }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,Segoe UI,Roboto,sans-serif;padding:16px;padding-bottom:88px;max-width:640px;margin:0 auto}
  h1{font-size:20px;margin:6px 0 2px} .sub{color:var(--mut);font-size:12px;margin-bottom:14px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .card{background:var(--card);border-radius:14px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.35)}
  .card .k{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  .card .v{font-size:24px;font-weight:800;margin-top:4px}
  .full{grid-column:1/3}
  pre{white-space:pre-wrap;word-break:break-word;font-size:12px;color:var(--mut);margin:8px 0 0}
  .row{display:flex;gap:8px;position:fixed;left:0;right:0;bottom:0;padding:12px 16px;background:linear-gradient(180deg,transparent,#0f1220 30%);max-width:640px;margin:0 auto}
  button{flex:1;border:0;border-radius:12px;padding:14px 8px;font-weight:700;font-size:14px;color:#0b0e1a;background:var(--acc)}
  button.ghost{background:#2a3153;color:var(--ink)}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700}
  .pill.ok{background:rgba(61,220,132,.15);color:var(--ok)} .pill.bad{background:rgba(255,107,107,.15);color:var(--bad)}
</style>
</head>
<body>
  <h1>OMI CEO Console</h1>
  <div class="sub" id="clock">—</div>
  <div class="grid">
    <div class="card"><div class="k">Agents</div><div class="v" id="agents">—</div></div>
    <div class="card"><div class="k">Skills</div><div class="v" id="skills">—</div></div>
    <div class="card"><div class="k">QA Pass</div><div class="v" id="qapass">—</div></div>
    <div class="card"><div class="k">Rollbacks</div><div class="v" id="rb">—</div></div>
    <div class="card full"><div class="k">Compat / Health</div><div class="v" id="compat">—</div><pre id="out">Nhấn Refresh để tải trạng thái…</pre></div>
  </div>
  <div class="row">
    <button class="ghost" onclick="load('/status')">Status</button>
    <button class="ghost" onclick="load('/report')">Report</button>
    <button onclick="cmd('build')">Build</button>
    <button onclick="cmd('fix')">Fix</button>
    <button onclick="cmd('deploy')">Deploy</button>
  </div>
<script>
  const API = ""; // same-origin; nginx proxy -> console api
  const TOKEN = localStorage.getItem("console_token") || "";
  function setClock(){ document.getElementById("clock").textContent = new Date().toLocaleString(); }
  setInterval(setClock, 1000); setClock();
  async function load(path){
    try{
      const r = await fetch(API + path, { headers: TOKEN ? {"X-Console-Token":TOKEN} : {} });
      const d = await r.json(); render(d);
    }catch(e){ document.getElementById("out").textContent = "Offline / lỗi mạng: " + e; }
  }
  async function cmd(name){
    const target = prompt("Target cho lệnh " + name + " (vd WF005):", "WF005"); if(target===null) return;
    try{
      const r = await fetch(API + "/" + name, { method:"POST",
        headers: Object.assign({"Content-Type":"application/json"}, TOKEN ? {"X-Console-Token":TOKEN} : {}),
        body: JSON.stringify({ target }) });
      render(await r.json());
    }catch(e){ document.getElementById("out").textContent = "Lỗi: " + e; }
  }
  function num(x){ return (x===undefined||x===null)?"—":x; }
  function render(d){
    const os = d.os || {}, ag = os.agents||{}, sk = os.skills||{}, qa = os.qa|| d.qa ||{};
    document.getElementById("agents").textContent = num(ag.registered ?? d.agents);
    document.getElementById("skills").textContent = num(sk.registered ?? d.skills);
    document.getElementById("qapass").textContent = num(qa.pass);
    document.getElementById("rb").textContent = num(os.rollbacks ?? d.rollbacks);
    const compat = (d.health&&d.health.compat) ?? d.compat;
    const el = document.getElementById("compat");
    el.innerHTML = compat===true ? '<span class="pill ok">COMPAT OK</span>' : (compat===false?'<span class="pill bad">CHECK</span>':'—');
    document.getElementById("out").textContent = JSON.stringify(d, null, 2);
  }
  if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
  load("/status");
</script>
</body>
</html>
