# OMI Platform — Production Compose (PRD-005)
# Dùng: docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d
name: omi-platform

services:
  crm-core:
    build: { context: .., dockerfile: deploy/Dockerfile.crm-core }
    restart: unless-stopped
    environment:
      CRM_DB_PATH: /data/crm_core.db
      CRM_PORT: "8080"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/dashboard/kpi',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [omi]

  auth-rbac:
    build: { context: .., dockerfile: deploy/Dockerfile.auth-rbac }
    restart: unless-stopped
    environment:
      AUTH_DB_PATH: /data/auth_rbac.db
      AUTH_PORT: "8081"
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8081/auth/me',timeout=5).status in (200,401) else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [omi]

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on: [crm-core, auth-rbac]
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ../apps/dashboard:/usr/share/nginx/html:ro
      - ./certs:/etc/letsencrypt
      - ./certbot-www:/var/www/certbot
    networks: [omi]

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./certs:/etc/letsencrypt
      - ./certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'"
    networks: [omi]

networks:
  omi:
    driver: bridge
