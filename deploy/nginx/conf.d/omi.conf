# OMI Platform — nginx server (PRD-005). Thay omi.example.com bằng domain thật (.env).
map $http_origin $omi_cors {
    default "";
    "~^https://(www\.)?omi\.example\.com$" $http_origin;   # chỉ cho origin hợp lệ
}

# HTTP :80 — ACME challenge + redirect HTTPS
server {
    listen 80;
    server_name omi.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# HTTPS :443
server {
    listen 443 ssl;
    http2 on;
    server_name omi.example.com;

    ssl_certificate     /etc/letsencrypt/live/omi.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/omi.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # --- Security headers (PRD-005 §hardening) ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;

    # --- CORS (chỉ origin hợp lệ) ---
    add_header Access-Control-Allow-Origin $omi_cors always;
    add_header Access-Control-Allow-Credentials "true" always;

    # Static dashboard
    root /usr/share/nginx/html;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }

    # API CRM Core → strip /api/crm
    location /api/crm/ {
        limit_req zone=omi_limit burst=20 nodelay;
        proxy_pass http://crm-core:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Auth & RBAC → strip /api/auth
    location /api/auth/ {
        limit_req zone=omi_limit burst=20 nodelay;
        proxy_pass http://auth-rbac:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
