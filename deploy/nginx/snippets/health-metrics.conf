# /api/health/* → runtime-health (PRD-011/12 handoff). Additive snippet.
# Kích hoạt: thêm `include /etc/nginx/conf.d/snippets/health-metrics.conf;` vào server 443
# trong omi.conf, VÀ chạy runtime-health container (deploy/docker-compose.health.yml overlay).
# /api/health/metrics → Prometheus text; /api/health/gateway → JSON.
location /api/health/ {
    limit_req zone=omi_limit burst=20 nodelay;
    proxy_pass http://runtime-health:8082/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
